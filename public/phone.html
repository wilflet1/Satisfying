<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paddle Controller</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee;
    font-family: system-ui, -apple-system, sans-serif; touch-action: none; overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 14px; }
  #status { text-align: center; font-size: 14px; opacity: .8; min-height: 1.2em; }
  #status.ok { color: #6f6; }
  #status.bad { color: #f77; }
  button { flex: 1; border: 0; border-radius: 22px; font-size: 30px; font-weight: 800;
    color: #fff; letter-spacing: .5px; }
  button:active { transform: scale(.97); filter: brightness(1.2); }
  #controls { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #row { flex: 1; display: flex; gap: 12px; min-height: 0; }
  #drop { background: #e8562a; flex: 2; }
  #center { background: #2a6fe8; font-size: 20px; }
  #slider { flex: 1.4; min-height: 0; width: 100%; touch-action: none; }
  #track { fill: none; stroke: #2b2f38; stroke-width: 11; stroke-linecap: round; }
  #fill { fill: none; stroke: #e8a12a; stroke-width: 11; stroke-linecap: round; opacity: .55; }
  #knob { fill: #f5f5f5; stroke: #e8a12a; stroke-width: 2.5; }
  #tick { stroke: #555; stroke-width: 1.2; }
  #start { background: #19a35b; }
  .hint { font-size: 13px; opacity: .75; text-align: center; line-height: 1.4; }
  .hidden { display: none !important; }
  body.xr, body.xr #app { background: transparent; }
  body.xr button { opacity: .85; }
</style>
</head>
<body>
<div id="app">
  <div id="status">Connecting…</div>
  <button id="start">TAP TO START</button>
  <div id="controls" class="hidden">
    <div id="row">
      <button id="drop">DROP BALL</button>
      <button id="center">RE-<br>CENTER</button>
    </div>
    <svg id="slider" viewBox="-9 6 118 64" preserveAspectRatio="xMidYMid meet">
      <line id="tick" x1="50" y1="12" x2="50" y2="17"></line>
      <path id="track"></path>
      <path id="fill"></path>
      <circle id="knob" r="7.5"></circle>
    </svg>
  </div>
  <div class="hint" id="hint">Hold the phone like a paddle handle (bottom of the phone = grip, screen = paddle face). Point it at your monitor and tap RE-CENTER. Slide your thumb along the curve to walk left/right. On Android, allow camera access: the camera tracks your hand 1:1.</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
let ws, sensorMode = '';

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?role=phone`);
  ws.onopen = () => setStatus(sensorMode ? `Connected · ${sensorMode}` : 'Connected — tap start', 'ok');
  ws.onclose = () => { setStatus('Disconnected — retrying…', 'bad'); setTimeout(connect, 800); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'hit' && navigator.vibrate) navigator.vibrate(Math.min(60, 12 + m.power * 8));
  };
}
connect();

// Only send when the socket is idle: a queued pose is a late pose.
function send(obj) {
  if (ws && ws.readyState === 1 && ws.bufferedAmount < 512) ws.send(JSON.stringify(obj));
}

// Quaternion (x, y, z, w) mapping device frame -> earth frame (X east, Y north, Z up).
// Each message also carries the fused grip position (earth frame, metres, relative to RE-CENTER).
let lastQ = [0, 0, 0, 1];
const r4 = (a) => a.map((v) => +v.toFixed(4));
function sendQuat(x, y, z, w) {
  lastQ = [x, y, z, w];
  send({ t: 'o', q: r4([x, y, z, w]), p: r4(gripOffset()), ar: arFresh() ? 1 : 0 });
}

// ---- small vector / quaternion helpers ([x, y, z, w]) ----
function rotate(q, v) {
  const [x, y, z, w] = q;
  const tx = 2 * (y * v[2] - z * v[1]), ty = 2 * (z * v[0] - x * v[2]), tz = 2 * (x * v[1] - y * v[0]);
  return [v[0] + w * tx + (y * tz - z * ty), v[1] + w * ty + (z * tx - x * tz), v[2] + w * tz + (x * ty - y * tx)];
}
const qmul = (a, b) => [
  a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
  a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
  a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
  a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
];
const qconj = (q) => [-q[0], -q[1], -q[2], q[3]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const H = Math.SQRT1_2;
const EARTH_TO_YUP = [-H, 0, 0, H]; // earth (Z up) -> Y-up frame used by WebXR

// ---- Hand tracking: accelerometer at full rate, corrected by the AR camera ----
// The accelerometer follows a fast swing with no lag but drifts within a second.
// The AR camera is slow (~30 Hz, delayed, blurs during swings) but doesn't drift.
// So: integrate acceleration for the motion, and pull towards the camera's answer
// whenever it has a good fix (a complementary filter, delay-compensated).
const IMU_TO_GRIP = 0.075;  // accelerometer ~ phone centre; grip = bottom edge
const CAM_TO_IMU = 0.06;    // back camera near the top
const AR_DELAY = 0.066;     // camera pose lags the accelerometer by ~2 frames
const OMEGA = 5;            // correction bandwidth (rad/s): how quickly drift is removed
const imuPos = [0, 0, 0], vel = [0, 0, 0];   // accelerometer point, earth frame
let origin = [0, 0, 0];
const history = [];         // recent { t, p } for delay compensation
let lastAccAt = 0, quiet = 0, lastArAt = -1e9, yawXr = null;
const accPrev = [0, 0, 0];

const gripAbs = () => add(imuPos, rotate(lastQ, [0, -IMU_TO_GRIP, 0]));
// No accelerometer readings (unsupported or blocked): keep the paddle at home rather than guess.
const gripOffset = () => (performance.now() - lastAccAt < 300 ? sub(gripAbs(), origin) : [0, 0, 0]);
const arFresh = () => xrActive && performance.now() - lastArAt < 400;

function onAccel(ax, ay, az) {
  const now = performance.now();
  const dt = lastAccAt ? Math.min(0.05, (now - lastAccAt) / 1000) : 0;
  lastAccAt = now;
  if (!dt) return;
  const a = rotate(lastQ, [ax || 0, ay || 0, az || 0]);
  const mag = Math.hypot(a[0], a[1], a[2]);
  quiet = mag < 0.35 ? quiet + dt : 0;
  const anchored = arFresh();
  // Dead-zone and "phone is still" only matter when nothing else stops drift.
  const still = !anchored && quiet > 0.08;
  // Without the camera there's nothing to stop drift, so ease back to home when idle.
  const vDecay = anchored ? 1 : Math.exp(-dt / 0.35);
  const pDecay = anchored ? 0 : 1 - Math.exp(-dt / 1.2);
  const home = add(origin, rotate(lastQ, [0, IMU_TO_GRIP, 0])); // IMU point when grip is at home
  const ac = !anchored && mag < 0.35 ? [0, 0, 0] : a;
  for (let i = 0; i < 3; i++) {
    // Trapezoid integration: half the error of plain Euler at swing speeds.
    const v0 = vel[i];
    vel[i] = still ? 0 : v0 * vDecay + 0.5 * (ac[i] + accPrev[i]) * dt;
    imuPos[i] += 0.5 * (v0 + vel[i]) * dt + (home[i] - imuPos[i]) * pDecay;
    accPrev[i] = ac[i];
  }
  history.push({ t: now, p: imuPos.slice() });
  while (history.length && now - history[0].t > 500) history.shift();
}

function onArPose(qX, camPos) {
  const now = performance.now();
  // Yaw between the AR world and the orientation sensor's world (both gravity-aligned).
  const d = qmul(qX, qconj(qmul(EARTH_TO_YUP, lastQ)));
  const yaw = 2 * Math.atan2(d[1], d[3]);
  if (yawXr === null) yawXr = yaw;
  else yawXr += Math.atan2(Math.sin(yaw - yawXr), Math.cos(yaw - yawXr)) * 0.05;
  const toEarth = qmul(qconj(EARTH_TO_YUP), [0, -Math.sin(yawXr / 2), 0, Math.cos(yawXr / 2)]);
  // Camera position -> accelerometer point, then into the earth frame.
  const measured = rotate(toEarth, add(camPos, rotate(qX, [0, -CAM_TO_IMU, 0])));

  const gap = (now - lastArAt) / 1000;
  const wasFresh = gap < 0.4;
  lastArAt = now;
  // Compare with where the accelerometer said we were when the frame was captured.
  const then = now - AR_DELAY * 1000;
  let past = history.length ? history[0].p : imuPos;
  for (let i = history.length - 1; i >= 0; i--) if (history[i].t <= then) { past = history[i].p; break; }
  const err = sub(measured, past);
  const shiftAll = (v, moveOrigin) => {
    for (let i = 0; i < 3; i++) { imuPos[i] += v[i]; if (moveOrigin) origin[i] += v[i]; }
    history.forEach((h) => { for (let i = 0; i < 3; i++) h.p[i] += v[i]; });
  };
  if (!wasFresh) {
    // First fix after a gap: line the AR world up with ours, keeping the hand where it was.
    shiftAll(err, true);
    return;
  }
  if (Math.hypot(err[0], err[1], err[2]) > 0.25) {
    // Accelerometer drifted a lot since the last fix (camera dropped out mid-swing):
    // trust the camera, and fix the velocity error that caused the drift.
    shiftAll(err, false);
    for (let i = 0; i < 3; i++) vel[i] += err[i] / Math.max(gap, 0.033);
    return;
  }
  const k1 = Math.min(1, 2 * 0.8 * OMEGA * gap), k2 = OMEGA * OMEGA * gap;
  for (let i = 0; i < 3; i++) { imuPos[i] += err[i] * k1; vel[i] += err[i] * k2; }
}

function resetHand() { vel.fill(0); origin = gripAbs(); }

// ---- AR session (Android Chrome + ARCore) ----
let xrSupported = false, xrActive = false;
if (navigator.xr) navigator.xr.isSessionSupported('immersive-ar').then((ok) => { xrSupported = ok; }).catch(() => {});

async function startXR() {
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['local'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: $('app') },
  });
  const gl = document.createElement('canvas').getContext('webgl', { xrCompatible: true, alpha: true });
  await gl.makeXRCompatible();
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
  const ref = await session.requestReferenceSpace('local');
  xrActive = true;
  document.body.classList.add('xr');
  session.addEventListener('end', () => {
    xrActive = false;
    document.body.classList.remove('xr');
    setStatus(`Connected · ${sensorMode} (AR ended)`, 'ok');
  });
  const onFrame = (t, frame) => {
    session.requestAnimationFrame(onFrame);
    const layer = session.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    const pose = frame.getViewerPose(ref);
    if (!pose || pose.emulatedPosition) return; // tracking lost (e.g. mid-swing blur): accelerometer carries on
    const o = pose.transform.orientation, p = pose.transform.position;
    onArPose([o.x, o.y, o.z, o.w], [p.x, p.y, p.z]);
  };
  session.requestAnimationFrame(onFrame);
}

function startAccel() {
  if ('LinearAccelerationSensor' in window) {
    try {
      const s = new LinearAccelerationSensor({ frequency: 120 });
      s.addEventListener('reading', () => onAccel(s.x, s.y, s.z));
      s.addEventListener('error', () => {
        window.addEventListener('devicemotion', (e) => e.acceleration && onAccel(e.acceleration.x, e.acceleration.y, e.acceleration.z));
      });
      s.start();
      return;
    } catch (_) {}
  }
  window.addEventListener('devicemotion', (e) => e.acceleration && onAccel(e.acceleration.x, e.acceleration.y, e.acceleration.z));
}

// ---- Curved slider: thumb sweeps an arc; position maps 1:1 to paddle left/right ----
const ARC = { cx: 50, cy: 84, r: 62, from: 140, to: 40 }; // degrees, left end -> right end
const arcPt = (deg) => {
  const a = deg * Math.PI / 180;
  return [ARC.cx + ARC.r * Math.cos(a), ARC.cy - ARC.r * Math.sin(a)];
};
const arcPath = (d0, d1) => {
  const [x0, y0] = arcPt(d0), [x1, y1] = arcPt(d1);
  return `M ${x0} ${y0} A ${ARC.r} ${ARC.r} 0 0 ${d1 < d0 ? 1 : 0} ${x1} ${y1}`;
};
$('track').setAttribute('d', arcPath(ARC.from, ARC.to));
let slide = 0; // -1..1
function drawSlider() {
  const deg = ARC.from + (slide + 1) / 2 * (ARC.to - ARC.from);
  const [x, y] = arcPt(deg);
  $('knob').setAttribute('cx', x);
  $('knob').setAttribute('cy', y);
  $('fill').setAttribute('d', arcPath(90, deg));
}
drawSlider();
const svg = $('slider');
function slideFromPointer(e, force) {
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const deg = Math.atan2(ARC.cy - pt.y, pt.x - ARC.cx) * 180 / Math.PI;
  const t = Math.min(1, Math.max(0, (ARC.from - deg) / (ARC.from - ARC.to)));
  slide = t * 2 - 1;
  drawSlider();
  const msg = { t: 's', x: +slide.toFixed(4) };
  if (force) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); } else send(msg);
}
svg.addEventListener('pointerdown', (e) => { svg.setPointerCapture(e.pointerId); slideFromPointer(e, true); });
svg.addEventListener('pointermove', (e) => { if (svg.hasPointerCapture(e.pointerId)) slideFromPointer(e); });
svg.addEventListener('pointerup', (e) => slideFromPointer(e, true));

// W3C deviceorientation (Z-X'-Y'' intrinsic) -> quaternion.
function eulerToQuat(alpha, beta, gamma) {
  const d = Math.PI / 360; // degrees -> half-angle radians
  const cz = Math.cos(alpha * d), sz = Math.sin(alpha * d);
  const cx = Math.cos(beta * d),  sx = Math.sin(beta * d);
  const cy = Math.cos(gamma * d), sy = Math.sin(gamma * d);
  // q = qz * qx * qy
  return [
    cz * sx * cy - sz * cx * sy,
    cz * cx * sy + sz * sx * cy,
    cz * sx * sy + sz * cx * cy,
    cz * cx * cy - sz * sx * sy,
  ];
}

// Resolves once real orientation data arrives, rejects if none comes in time.
function startDeviceOrientation() {
  return new Promise((resolve, reject) => {
    let got = false;
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha == null) return;
      if (!got) { got = true; resolve(); }
      const q = eulerToQuat(e.alpha, e.beta, e.gamma);
      sendQuat(q[0], q[1], q[2], q[3]);
    });
    setTimeout(() => { if (!got) reject(new Error('no motion data')); }, 2000);
  });
}

async function startSensors() {
  // iOS (and some Chrome versions) expose a permission prompt that must run in the tap.
  // Its answer isn't always reliable on Android, so note it and keep trying.
  let permission = 'granted';
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    try { permission = await DeviceOrientationEvent.requestPermission(); } catch (_) { permission = 'error'; }
  }
  // Prefer the Generic Sensor API (Chrome/Android): direct quaternion, higher rate.
  if ('RelativeOrientationSensor' in window) {
    try {
      const s = new RelativeOrientationSensor({ frequency: 120, referenceFrame: 'device' });
      await new Promise((resolve, reject) => {
        s.addEventListener('reading', function first() {
          s.removeEventListener('reading', first);
          resolve();
        });
        s.addEventListener('error', (e) => reject(e.error));
        s.start();
        setTimeout(() => reject(new Error('sensor timeout')), 1500);
      });
      s.addEventListener('reading', () => { const q = s.quaternion; sendQuat(q[0], q[1], q[2], q[3]); });
      sensorMode = 'orientation sensor';
      return;
    } catch (err) {
      console.warn('RelativeOrientationSensor unavailable, falling back', err);
    }
  }
  try {
    await startDeviceOrientation();
    sensorMode = 'orientation events';
  } catch (_) {
    throw new Error(permission === 'granted' ? 'no motion data from the phone' : 'motion permission denied');
  }
}

const isAndroid = /Android/i.test(navigator.userAgent);
let httpPhoneUrl = location.href;
fetch('/info').then((r) => r.json()).then((i) => { httpPhoneUrl = i.httpPhoneUrl; }).catch(() => {});

function androidHelp() {
  const origin = new URL(httpPhoneUrl).origin;
  $('hint').innerHTML =
    '<b>Chrome is blocking motion sensors.</b><br>' +
    '1. Tap the icon left of the address bar → Permissions / Site settings → <b>Motion sensors → Allow</b>, then reload.<br>' +
    '2. If that doesn\'t fix it (Chrome often blocks sensors on certificate-warning pages):<br>' +
    'open <b>chrome://flags</b>, search <i>insecure origins treated as secure</i>, enter<br>' +
    `<b style="user-select:all">${origin}</b><br>` +
    'set it to Enabled, tap Relaunch, then open<br>' +
    `<b style="user-select:all">${httpPhoneUrl}</b>`;
}

function iosHelp() {
  $('hint').innerHTML = 'iPhone remembers a "Deny" until Safari restarts:<br>' +
    '1. Swipe Safari away in the app switcher, reopen this page<br>' +
    '2. Tap START, then tap <b>Allow</b> on the motion prompt<br>' +
    'Still no prompt? Settings → Apps → Safari → Advanced → Website Data → delete this address, then try again.';
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {});
      });
    }
  } catch (_) {}
}

$('start').addEventListener('click', async () => {
  if (!window.isSecureContext) {
    setStatus('This address is not trusted for motion sensors', 'bad');
    isAndroid ? androidHelp() : iosHelp();
    return;
  }
  // AR first: it needs the tap's user activation, which later awaits would use up.
  if (xrSupported) {
    try { await startXR(); } catch (err) { console.warn('AR unavailable', err); }
  }
  try {
    await startSensors();
  } catch (err) {
    if (!xrActive) {
      setStatus('Sensor error: ' + err.message, 'bad');
      isAndroid ? androidHelp() : iosHelp();
      return;
    }
    sensorMode = 'AR pose only';
  }
  startAccel();
  if (!xrActive) keepAwake();
  $('start').classList.add('hidden');
  $('controls').classList.remove('hidden');
  setStatus(`Connected · ${xrActive ? 'camera + motion fusion' : 'no AR: movement estimated'} · ${sensorMode}`, 'ok');
  send({ t: 's', x: 0 });
  center();
});

function center() {
  resetHand();
  send({ t: 'center' });
}

// pointerdown instead of click: fires immediately, no 300ms tap delay.
$('drop').addEventListener('pointerdown', () => { send({ t: 'drop' }); navigator.vibrate && navigator.vibrate(10); });
$('center').addEventListener('pointerdown', () => { center(); navigator.vibrate && navigator.vibrate(10); });
</script>
</body>
</html>

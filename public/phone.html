<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paddle Controller</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee;
    font-family: system-ui, -apple-system, sans-serif; touch-action: none; overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 14px; }
  #status { text-align: center; font-size: 14px; opacity: .8; min-height: 1.2em; }
  #status.ok { color: #6f6; }
  #status.bad { color: #f77; }
  button { flex: 1; border: 0; border-radius: 22px; font-size: 30px; font-weight: 800;
    color: #fff; letter-spacing: .5px; }
  button:active { transform: scale(.97); filter: brightness(1.2); }
  #controls { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #row { flex: 1; display: flex; gap: 12px; min-height: 0; }
  #drop { background: #e8562a; flex: 2; }
  #center { background: #2a6fe8; font-size: 20px; }
  #slider { flex: 1.4; min-height: 0; width: 100%; touch-action: none; }
  #track { fill: none; stroke: #2b2f38; stroke-width: 11; stroke-linecap: round; }
  #fill { fill: none; stroke: #e8a12a; stroke-width: 11; stroke-linecap: round; opacity: .55; }
  #knob { fill: #f5f5f5; stroke: #e8a12a; stroke-width: 2.5; }
  #tick { stroke: #555; stroke-width: 1.2; }
  #start { background: #19a35b; }
  .hint { font-size: 13px; opacity: .75; text-align: center; line-height: 1.4; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="status">Connecting…</div>
  <button id="start">TAP TO START</button>
  <div id="controls" class="hidden">
    <div id="row">
      <button id="drop">DROP BALL</button>
      <button id="center">RE-<br>CENTER</button>
    </div>
    <svg id="slider" viewBox="-9 6 118 64" preserveAspectRatio="xMidYMid meet">
      <line id="tick" x1="50" y1="12" x2="50" y2="17"></line>
      <path id="track"></path>
      <path id="fill"></path>
      <circle id="knob" r="7.5"></circle>
    </svg>
  </div>
  <div class="hint" id="hint">Hold the phone like a paddle handle (bottom of the phone = grip, screen = paddle face). Point it at your monitor and tap RE-CENTER. Slide your thumb along the curve to move left/right.</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
let ws, sensorMode = '';

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?role=phone`);
  ws.onopen = () => setStatus(sensorMode ? `Connected · ${sensorMode}` : 'Connected — tap start', 'ok');
  ws.onclose = () => { setStatus('Disconnected — retrying…', 'bad'); setTimeout(connect, 800); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'hit' && navigator.vibrate) navigator.vibrate(Math.min(60, 12 + m.power * 8));
  };
}
connect();

// Only send when the socket is idle: a queued pose is a late pose.
function send(obj) {
  if (ws && ws.readyState === 1 && ws.bufferedAmount < 256) ws.send(JSON.stringify(obj));
}

// Quaternion (x, y, z, w) mapping device frame -> earth frame (X east, Y north, Z up).
// Also carries the current swing velocity (earth frame) so hits get the real swing speed.
let lastQ = [0, 0, 0, 1];
const vel = [0, 0, 0];
function sendQuat(x, y, z, w) {
  lastQ = [x, y, z, w];
  send({ t: 'o', q: [+x.toFixed(5), +y.toFixed(5), +z.toFixed(5), +w.toFixed(5)],
    v: [+vel[0].toFixed(3), +vel[1].toFixed(3), +vel[2].toFixed(3)] });
}

// Rotate vector v by quaternion q.
function rotate(q, v) {
  const [x, y, z, w] = q;
  const tx = 2 * (y * v[2] - z * v[1]), ty = 2 * (z * v[0] - x * v[2]), tz = 2 * (x * v[1] - y * v[0]);
  return [v[0] + w * tx + (y * tz - z * ty), v[1] + w * ty + (z * tx - x * tz), v[2] + w * tz + (x * ty - y * tx)];
}

// Swing speed: integrate gravity-free acceleration with a short leak so it can't drift.
// Used only for hit power; the paddle's on-screen position comes from the slider.
let lastAccAt = 0;
function onAccel(ax, ay, az) {
  const now = performance.now();
  const dt = lastAccAt ? Math.min(0.05, (now - lastAccAt) / 1000) : 0;
  lastAccAt = now;
  const a = rotate(lastQ, [ax || 0, ay || 0, az || 0]);
  const decay = Math.exp(-dt / 0.15);
  for (let i = 0; i < 3; i++) vel[i] = vel[i] * decay + (Math.abs(a[i]) < 0.4 ? 0 : a[i]) * dt;
}

function startAccel() {
  if ('LinearAccelerationSensor' in window) {
    try {
      const s = new LinearAccelerationSensor({ frequency: 120 });
      s.addEventListener('reading', () => onAccel(s.x, s.y, s.z));
      s.addEventListener('error', () => {
        window.addEventListener('devicemotion', (e) => e.acceleration && onAccel(e.acceleration.x, e.acceleration.y, e.acceleration.z));
      });
      s.start();
      return;
    } catch (_) {}
  }
  window.addEventListener('devicemotion', (e) => e.acceleration && onAccel(e.acceleration.x, e.acceleration.y, e.acceleration.z));
}

// ---- Curved slider: thumb sweeps an arc; position maps 1:1 to paddle left/right ----
const ARC = { cx: 50, cy: 84, r: 62, from: 140, to: 40 }; // degrees, left end -> right end
const arcPt = (deg) => {
  const a = deg * Math.PI / 180;
  return [ARC.cx + ARC.r * Math.cos(a), ARC.cy - ARC.r * Math.sin(a)];
};
const arcPath = (d0, d1) => {
  const [x0, y0] = arcPt(d0), [x1, y1] = arcPt(d1);
  return `M ${x0} ${y0} A ${ARC.r} ${ARC.r} 0 0 ${d1 < d0 ? 1 : 0} ${x1} ${y1}`;
};
$('track').setAttribute('d', arcPath(ARC.from, ARC.to));
let slide = 0; // -1..1
function drawSlider() {
  const deg = ARC.from + (slide + 1) / 2 * (ARC.to - ARC.from);
  const [x, y] = arcPt(deg);
  $('knob').setAttribute('cx', x);
  $('knob').setAttribute('cy', y);
  $('fill').setAttribute('d', arcPath(90, deg));
}
drawSlider();
const svg = $('slider');
function slideFromPointer(e, force) {
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const deg = Math.atan2(ARC.cy - pt.y, pt.x - ARC.cx) * 180 / Math.PI;
  const t = Math.min(1, Math.max(0, (ARC.from - deg) / (ARC.from - ARC.to)));
  slide = t * 2 - 1;
  drawSlider();
  const msg = { t: 's', x: +slide.toFixed(4) };
  if (force) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); } else send(msg);
}
svg.addEventListener('pointerdown', (e) => { svg.setPointerCapture(e.pointerId); slideFromPointer(e, true); });
svg.addEventListener('pointermove', (e) => { if (svg.hasPointerCapture(e.pointerId)) slideFromPointer(e); });
svg.addEventListener('pointerup', (e) => slideFromPointer(e, true));

// W3C deviceorientation (Z-X'-Y'' intrinsic) -> quaternion.
function eulerToQuat(alpha, beta, gamma) {
  const d = Math.PI / 360; // degrees -> half-angle radians
  const cz = Math.cos(alpha * d), sz = Math.sin(alpha * d);
  const cx = Math.cos(beta * d),  sx = Math.sin(beta * d);
  const cy = Math.cos(gamma * d), sy = Math.sin(gamma * d);
  // q = qz * qx * qy
  return [
    cz * sx * cy - sz * cx * sy,
    cz * cx * sy + sz * sx * cy,
    cz * sx * sy + sz * cx * cy,
    cz * cx * cy - sz * sx * sy,
  ];
}

// Resolves once real orientation data arrives, rejects if none comes in time.
function startDeviceOrientation() {
  return new Promise((resolve, reject) => {
    let got = false;
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha == null) return;
      if (!got) { got = true; resolve(); }
      const q = eulerToQuat(e.alpha, e.beta, e.gamma);
      sendQuat(q[0], q[1], q[2], q[3]);
    });
    setTimeout(() => { if (!got) reject(new Error('no motion data')); }, 2000);
  });
}

async function startSensors() {
  // iOS (and some Chrome versions) expose a permission prompt that must run in the tap.
  // Its answer isn't always reliable on Android, so note it and keep trying.
  let permission = 'granted';
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    try { permission = await DeviceOrientationEvent.requestPermission(); } catch (_) { permission = 'error'; }
  }
  // Prefer the Generic Sensor API (Chrome/Android): direct quaternion, higher rate.
  if ('RelativeOrientationSensor' in window) {
    try {
      const s = new RelativeOrientationSensor({ frequency: 120, referenceFrame: 'device' });
      await new Promise((resolve, reject) => {
        s.addEventListener('reading', function first() {
          s.removeEventListener('reading', first);
          resolve();
        });
        s.addEventListener('error', (e) => reject(e.error));
        s.start();
        setTimeout(() => reject(new Error('sensor timeout')), 1500);
      });
      s.addEventListener('reading', () => { const q = s.quaternion; sendQuat(q[0], q[1], q[2], q[3]); });
      sensorMode = 'orientation sensor';
      return;
    } catch (err) {
      console.warn('RelativeOrientationSensor unavailable, falling back', err);
    }
  }
  try {
    await startDeviceOrientation();
    sensorMode = 'orientation events';
  } catch (_) {
    throw new Error(permission === 'granted' ? 'no motion data from the phone' : 'motion permission denied');
  }
}

const isAndroid = /Android/i.test(navigator.userAgent);
let httpPhoneUrl = location.href;
fetch('/info').then((r) => r.json()).then((i) => { httpPhoneUrl = i.httpPhoneUrl; }).catch(() => {});

function androidHelp() {
  const origin = new URL(httpPhoneUrl).origin;
  $('hint').innerHTML =
    '<b>Chrome is blocking motion sensors.</b><br>' +
    '1. Tap the icon left of the address bar → Permissions / Site settings → <b>Motion sensors → Allow</b>, then reload.<br>' +
    '2. If that doesn\'t fix it (Chrome often blocks sensors on certificate-warning pages):<br>' +
    'open <b>chrome://flags</b>, search <i>insecure origins treated as secure</i>, enter<br>' +
    `<b style="user-select:all">${origin}</b><br>` +
    'set it to Enabled, tap Relaunch, then open<br>' +
    `<b style="user-select:all">${httpPhoneUrl}</b>`;
}

function iosHelp() {
  $('hint').innerHTML = 'iPhone remembers a "Deny" until Safari restarts:<br>' +
    '1. Swipe Safari away in the app switcher, reopen this page<br>' +
    '2. Tap START, then tap <b>Allow</b> on the motion prompt<br>' +
    'Still no prompt? Settings → Apps → Safari → Advanced → Website Data → delete this address, then try again.';
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {});
      });
    }
  } catch (_) {}
}

$('start').addEventListener('click', async () => {
  if (!window.isSecureContext) {
    setStatus('This address is not trusted for motion sensors', 'bad');
    isAndroid ? androidHelp() : iosHelp();
    return;
  }
  try {
    await startSensors();
  } catch (err) {
    setStatus('Sensor error: ' + err.message, 'bad');
    isAndroid ? androidHelp() : iosHelp();
    return;
  }
  startAccel();
  keepAwake();
  $('start').classList.add('hidden');
  $('controls').classList.remove('hidden');
  setStatus(`Connected · ${sensorMode}`, 'ok');
  send({ t: 'center' });
});

// pointerdown instead of click: fires immediately, no 300ms tap delay.
$('drop').addEventListener('pointerdown', () => { send({ t: 'drop' }); navigator.vibrate && navigator.vibrate(10); });
$('center').addEventListener('pointerdown', () => { send({ t: 'center' }); navigator.vibrate && navigator.vibrate(10); });
</script>
</body>
</html>

name: PCLink

on:
  push:
    paths: ["PCLink/**", ".github/workflows/pclink.yml"]
  pull_request:
    paths: ["PCLink/**", ".github/workflows/pclink.yml"]
  workflow_dispatch:

# The run number is the build number both apps use to detect updates.
env:
  PCLINK_BUILD: ${{ github.run_number }}
  PCLINK_REPO: ${{ github.repository }}

jobs:
  pc-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PCLink/pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PCLink/pc
      - run: cargo test

  pc-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PCLink/pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PCLink/pc
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pclink-windows
          path: |
            PCLink/pc/target/release/pclink-agent.exe
            PCLink/pc/target/release/pclink.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PCLink/android
    env:
      KEYSTORE_B64: ${{ secrets.PCLINK_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Optional: sign with your own key stored in repository secrets.
      - name: Use signing key from secrets
        if: env.KEYSTORE_B64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.PCLINK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PCLINK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PCLINK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "PCLINK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "PCLINK_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "PCLINK_KEY_ALIAS=$KEY_ALIAS"
            echo "PCLINK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      # The runner image ships the Android SDK (ANDROID_HOME).
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pclink-android
          path: PCLink/android/app/build/outputs/apk/release/app-release.apk

  # Publishes the "pclink-latest" pre-release that both apps update from.
  release:
    if: github.event_name == 'push'
    needs: [pc-test, pc-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble release files
        run: |
          mkdir out
          cp dist/pclink-windows/pclink-agent.exe dist/pclink-windows/pclink.exe out/
          cp dist/pclink-android/app-release.apk out/PCLink.apk
          (cd out && zip -q PCLink-windows.zip pclink-agent.exe pclink.exe)
          python3 - <<'PY'
          import hashlib, json, os
          files = {}
          for name in ["pclink-agent.exe", "pclink.exe", "PCLink.apk"]:
              data = open(f"out/{name}", "rb").read()
              files[name] = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          manifest = {"build": int(os.environ["PCLINK_BUILD"]), "commit": os.environ["GITHUB_SHA"], "files": files}
          open("out/latest.json", "w").write(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pclink-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create pclink-latest out/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "PCLink build $PCLINK_BUILD" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. PC: PCLink-windows.zip (or the two .exe files). Phone: PCLink.apk (Android 11+). Both update themselves to newer builds."

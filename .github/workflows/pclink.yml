name: PCLink

on:
  push:
    paths: ["PCLink/**", ".github/workflows/pclink.yml"]
  pull_request:
    paths: ["PCLink/**", ".github/workflows/pclink.yml"]
  workflow_dispatch:

jobs:
  pc-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PCLink/pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PCLink/pc
      - run: cargo test

  pc-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PCLink/pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PCLink/pc
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pclink-windows
          path: |
            PCLink/pc/target/release/pclink-agent.exe
            PCLink/pc/target/release/pclink.exe

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: PCLink/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK (ANDROID_HOME).
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pclink-android
          path: PCLink/android/app/build/outputs/apk/release/*.apk
      # A fixed "pclink-latest" pre-release gives a plain download link for
      # the newest APK (artifacts need a GitHub login to download).
      - name: Publish APK to the pclink-latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PCLink.apk
          gh release delete pclink-latest --cleanup-tag --yes || true
          gh release create pclink-latest PCLink.apk --prerelease --target "$GITHUB_SHA" \
            --title "PCLink (latest build)" \
            --notes "Android app built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install PCLink.apk on Android 11+."

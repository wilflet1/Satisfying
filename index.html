<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Split to fit, merge to smash. A liquid-metal one-thumb runner."
    />
    <title>QUICKSILVER</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.5' stop-color='%2329e0ff'/%3E%3Cstop offset='1' stop-color='%232f7dff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='13' r='9' fill='url(%23g)'/%3E%3Ccircle cx='24' cy='23' r='5' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #dff1ff;
        --dim: #7b8ba6;
        --cyan: #29e0ff;
        --amber: #ffa02b;
        --red: #ff3c4e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #05060c;
        overscroll-behavior: none;
      }
      body {
        font: 500 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
        display: flex;
        flex-direction: column;
      }

      /* ---- top bar: depth + multiplier ---- */
      .top {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      #score {
        font: 700 clamp(30px, 9vw, 46px) / 1 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: -0.02em;
        text-shadow: 0 0 22px rgba(41, 224, 255, 0.45);
        font-variant-numeric: tabular-nums;
      }
      .unit {
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mult {
        margin-left: auto;
        font: 700 clamp(16px, 5vw, 22px) / 1 ui-monospace, Menlo, monospace;
        color: var(--cyan);
        text-shadow: 0 0 18px rgba(41, 224, 255, 0.6);
      }
      #mult.hot {
        color: var(--amber);
        text-shadow: 0 0 22px rgba(255, 160, 43, 0.7);
      }
      #mult.bump {
        animation: bump 0.28s cubic-bezier(0.2, 1.7, 0.4, 1);
      }
      @keyframes bump {
        0% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ---- mass bar + split pips ---- */
      .bottom {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #mass {
        height: 6px;
        border-radius: 99px;
        background: rgba(120, 160, 220, 0.16);
        overflow: hidden;
      }
      #mass-fill {
        height: 100%;
        width: 100%;
        transform-origin: left;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f7dff, #29e0ff 60%, #b6f6ff);
        box-shadow: 0 0 16px rgba(41, 224, 255, 0.65);
        transition: background 0.25s;
      }
      #mass-fill.low {
        background: linear-gradient(90deg, #ff2d3f, #ff7a3c);
        box-shadow: 0 0 18px rgba(255, 60, 78, 0.8);
        animation: pulse 0.65s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      #pips {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .pip {
        width: 20px;
        height: 3px;
        border-radius: 99px;
        background: rgba(120, 160, 220, 0.2);
        transition:
          background 0.14s,
          box-shadow 0.14s;
      }
      .pip.on {
        background: var(--cyan);
        box-shadow: 0 0 10px rgba(41, 224, 255, 0.85);
      }

      /* ---- overlays ---- */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.3s,
          visibility 0.3s;
        background: radial-gradient(ellipse at center, rgba(5, 6, 12, 0.35), rgba(5, 6, 12, 0.85));
      }
      .overlay.show {
        opacity: 1;
        visibility: visible;
      }
      h1 {
        font: 800 clamp(38px, 13vw, 76px) / 0.95 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.14em;
        background: linear-gradient(180deg, #ffffff, #7fd8ff 55%, #2f7dff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 30px rgba(41, 224, 255, 0.45));
      }
      .tag {
        color: var(--dim);
        letter-spacing: 0.22em;
        font-size: clamp(10px, 3vw, 13px);
        text-transform: uppercase;
      }
      .keys {
        display: grid;
        gap: 8px;
        margin-top: 10px;
        font-size: clamp(12px, 3.4vw, 15px);
        color: var(--dim);
      }
      .keys b {
        color: var(--ink);
        font-weight: 700;
      }
      .cta {
        margin-top: 18px;
        font-size: clamp(13px, 4vw, 17px);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      #final-score {
        font: 800 clamp(56px, 20vw, 110px) / 1 ui-monospace, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 36px rgba(41, 224, 255, 0.5);
      }
      #new-best {
        display: none;
        color: var(--amber);
        letter-spacing: 0.2em;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
      }
      #new-best.show {
        display: block;
      }
      #title-best,
      #final-best {
        color: var(--dim);
        letter-spacing: 0.16em;
        font-size: 13px;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05060c;
        color: var(--dim);
        letter-spacing: 0.25em;
        font-size: 12px;
        transition: opacity 0.4s;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #fatal {
        display: none;
        position: fixed;
        inset: 0;
        place-items: center;
        padding: 32px;
        text-align: center;
        background: #05060c;
        z-index: 10;
      }
      #fatal.show {
        display: grid;
      }
      #fatal-msg {
        color: var(--red);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        margin-top: 12px;
        max-width: 40ch;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div id="ui">
      <div class="top">
        <div id="score">0</div>
        <div class="unit">m</div>
        <div id="mult"></div>
      </div>

      <div class="bottom">
        <div id="pips"></div>
        <div id="mass"><div id="mass-fill"></div></div>
      </div>

      <div id="title" class="overlay">
        <h1>QUICKSILVER</h1>
        <div class="tag">split to fit &nbsp;·&nbsp; merge to smash</div>
        <div class="keys">
          <div><b>Drag</b> to steer</div>
          <div><b>Tap</b> to split</div>
          <div><b>Swipe up</b> to merge</div>
        </div>
        <div id="title-best"></div>
        <div class="cta">Tap to drop</div>
      </div>

      <div id="over" class="overlay">
        <div class="tag">depth reached</div>
        <div id="final-score">0</div>
        <div id="new-best">new best</div>
        <div id="final-best"></div>
        <div class="cta">Tap to retry</div>
      </div>
    </div>

    <div id="boot">LOADING</div>
    <div id="fatal">
      <div>
        <h1>NO WEBGL2</h1>
        <div id="fatal-msg"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
